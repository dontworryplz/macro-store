[package]
name = "mss"
version = "0.3.0"
description = "Macro Store — Flathub tabanlı Linux yazılım mağazası"
authors = ["Macro Store"]
edition = "2021"
rust-version = "1.90.0"

[lib]
name = "mss_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures = "0.3"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt", "time"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true
